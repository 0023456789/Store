server:
  port: 8081
  servlet:
    context-path: /api/v1

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: storevn
  datasource:
    url: ${STORE_DB_URL:jdbc:postgresql://localhost:5433/store}
    username: ${STORE_DB_USER:postgres}
    password: ${STORE_DB_PASSWORD:secret}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    baseline-on-migrate: true

adminsky:
  api:
    base-url: ${ADMIN_SKY_API_URL:http://localhost:8080/api/v1}
    connect-timeout-ms: ${ADMIN_SKY_API_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${ADMIN_SKY_API_READ_TIMEOUT_MS:5000}

vnpay:
  tmn-code: ${VNPAY_TMN_CODE:}
  hash-secret: ${VNPAY_HASH_SECRET:}
  pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  api-url: ${VNPAY_API_URL:https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
  server-ip: ${VNPAY_SERVER_IP:}
  reconcile-enabled: ${VNPAY_RECONCILE_ENABLED:true}
  reconcile-interval-ms: ${VNPAY_RECONCILE_INTERVAL_MS:60000}
  reconcile-grace-minutes: ${VNPAY_RECONCILE_GRACE_MINUTES:2}

storefront:
  public-base-url: ${STOREFRONT_PUBLIC_BASE_URL:http://localhost:8081}
  web-url: ${STOREFRONT_WEB_URL:http://localhost:5173}
  order-ttl-minutes: ${ORDER_TTL_MINUTES:15}

management:
  endpoints:
    web:
      exposure:
        include: health

springdoc:
  swagger-ui:
    path: /storevn/swagger-ui.html
  api-docs:
    path: /storevn/v3/api-docs
